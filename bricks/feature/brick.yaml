name: feature
description: >-
  Scaffolds a new feature into an existing core_init project: all three
  data/domain/presentation layers, DI registration via injectable
  annotations, a new route entry (via a post_gen hook), and test skeletons.
  Run `mason make feature --feature_name <new_feature_name>` from the root
  of a project generated by core_init — project_name is read from that
  project's pubspec.yaml by a pre_gen hook, so it does not need to be
  passed (override with --project_name only when generating from outside
  the project, e.g. with -o).
version: 0.1.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  feature_name:
    type: string
    description: The new feature's name (lowercase snake_case), e.g. "user_profile".
    default: new_feature
    prompt: What is the feature named? (snake_case)

# `project_name` is deliberately NOT a var here — mason prompts for every
# declared var, and this one is knowable without asking. `hooks/pre_gen.dart`
# reads it from ./pubspec.yaml (the project you're running inside) and puts
# it in the context before generation. When there is no ./pubspec.yaml
# (e.g. generating into a fresh directory with -o), set the FEATURE_PROJECT_NAME
# environment variable instead; the hook fails with instructions if it can
# find neither.
