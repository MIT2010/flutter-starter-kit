name: feature
description: >-
  Scaffolds a new feature into an existing core_init project: all three
  data/domain/presentation layers, DI registration via injectable
  annotations, a new route entry (via a post_gen hook), and test skeletons.
  Run mason make feature --project_name <existing_project_pubspec_name>
  --feature_name <new_feature_name> from the root of a project generated by
  core_init.
version: 0.1.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  feature_name:
    type: string
    description: The new feature's name (lowercase snake_case), e.g. "user_profile".
    default: new_feature
    prompt: What is the feature named? (snake_case)
  project_name:
    type: string
    description: >-
      The pubspec name of the EXISTING project you're scaffolding into
      (must match pubspec.yaml -> name exactly) — used to generate correct
      package: imports.
    default: my_app
    prompt: What is the existing project's package name (pubspec.yaml -> name)?
