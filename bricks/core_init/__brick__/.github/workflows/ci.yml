name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test (development config — the default)
        run: flutter test

      - name: Test (production config — proves ENABLE_NETWORK_LOGGING=false is actually exercised)
        run: >
          flutter test --dart-define-from-file=config/production.json
          test/core/network/interceptors/logging_interceptor_test.dart
