name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the exact SDK pinned in .fvmrc, so CI and local (FVM) builds
      # match — see docs/decisions/ADR-0016. subosito/flutter-action reads
      # the `flutter` key from that file.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test (development config — the default)
        run: flutter test

      - name: Test (production config — proves ENABLE_NETWORK_LOGGING=false is actually exercised)
        run: >
          flutter test --dart-define-from-file=config/production.json
          test/core/network/interceptors/logging_interceptor_test.dart
