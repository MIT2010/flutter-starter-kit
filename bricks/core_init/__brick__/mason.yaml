# Registers the `feature` brick for use from within THIS generated project
# (`mason make feature --feature_name my_feature`, run from the project
# root — the package name is read from pubspec.yaml, see ADR-0015).
#
# The `feature` brick's source lives in the starter kit repo you generated
# this project from, not inside this project. If you fork or re-host the
# kit, point the URL below at your own remote. See docs/decisions for why
# this isn't a local path or a bundled copy.
bricks:
  feature:
    git:
      url: https://github.com/MIT2010/flutter-starter-kit.git
      path: bricks/feature
